version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: medifind-postgres
    environment:
      POSTGRES_USER: medifind_user
      POSTGRES_PASSWORD: medifind_password
      POSTGRES_DB: medifind_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medifind_user -d medifind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medifind-network

  redis:
    image: redis:7-alpine
    container_name: medifind-redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medifind-network

  adminer:
    image: adminer:latest
    container_name: medifind-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - medifind-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  medifind-network:
    driver: bridge
